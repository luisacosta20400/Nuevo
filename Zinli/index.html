<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zinli - Iniciar Sesión</title>
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        :root {
            --purple-primary: #5A2D82;
            --purple-light: #EBE4FF;
            --purple-disabled: #E4DAFD;
            --purple-disabled-text: #BCA9EE;
            --purple-active: #481F6E;
            --text-dark: #2A2A2A;
            --text-muted: #6E6E6E;
            --border-color: #79747E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #F8F9FA;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor principal responsive */
        .app-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 28px;
        }

        /* En PC se centra como tarjeta */
        @media (min-width: 600px) {
            .app-container {
                height: 90vh;
                max-height: 750px;
                border-radius: 24px;
                box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.08);
            }
        }

        /* Encabezado */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
        }

        /* Logo con tamaño ajustado y sin fondo */
        .logo-img {
            height: 40px;
            object-fit: contain;
            mix-blend-mode: multiply;
        }

        .chat-icon {
            color: var(--purple-primary);
            font-size: 28px;
            cursor: pointer;
        }

        /* Formulario */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: -30px;
        }

        .title-group {
            text-align: center;
            margin-bottom: 35px;
        }

        .title-group p {
            font-size: 15px;
            color: var(--text-dark);
            font-weight: 500;
        }

        .title-group h2 {
            font-size: 20px;
            color: var(--text-dark);
            font-weight: 700;
            margin-top: 4px;
        }

        .form-group {
            width: 100%;
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            border: none;
            border-bottom: 1.5px solid var(--border-color);
            padding: 8px 0;
            font-size: 15px;
            color: var(--text-dark);
            outline: none;
            background: transparent;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-bottom-color: var(--purple-primary);
        }

        .toggle-password {
            position: absolute;
            right: 0;
            cursor: pointer;
            color: var(--text-dark);
            user-select: none;
        }

        .forgot-link {
            display: block;
            text-align: center;
            color: var(--purple-primary);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            margin: 15px 0 25px 0;
        }

        /* Botón Ingresar */
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background-color: var(--purple-disabled);
            color: var(--purple-disabled-text);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: not-allowed;
            transition: all 0.3s ease;
        }

        .btn-submit.active {
            background-color: var(--purple-primary);
            color: #FFFFFF;
            cursor: pointer;
        }

        .btn-submit.active:hover {
            background-color: var(--purple-active);
        }

        /* Checkbox Recuérdame */
        .remember-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            cursor: pointer;
        }

        .remember-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--purple-primary);
            cursor: pointer;
        }

        .remember-group span {
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 500;
        }

        /* Footer */
        footer {
            text-align: center;
            padding-bottom: 12px;
        }

        .new-account-btn {
            background: none;
            border: none;
            color: var(--purple-primary);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.2px;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Encabezado con Logo -->
        <header>
            <img src="logo.webp" alt="Zinli Logo" class="logo-img">
            <span class="material-symbols-outlined chat-icon">chat_bubble_outline</span>
        </header>

        <!-- Formulario Principal -->
        <main class="content">
            <div class="title-group">
                <p id="greetingText">¡Buenas noches!</p>
                <h2>Ingresa tus datos</h2>
            </div>

            <form id="loginForm" style="width: 100%;">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" class="form-control" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-control" required>
                        <span class="material-symbols-outlined toggle-password" id="togglePassword">visibility_off</span>
                    </div>
                </div>

                <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>

                <button type="submit" id="btnSubmit" class="btn-submit" disabled>INGRESAR</button>

                <div class="remember-group" onclick="document.getElementById('remember').click();">
                    <input type="checkbox" id="remember" onclick="event.stopPropagation();">
                    <span>Recuérdame</span>
                </div>
            </form>
        </main>

        <!-- Pie de página -->
        <footer>
            <button type="button" class="new-account-btn">ABRIR CUENTA NUEVA</button>
        </footer>
    </div>


    <script src="data.js"></script>

    <!-- Script de interacción y horario dinámico -->
    <script>
        // Actualizar saludo según la hora de Panamá (America/Panama)
        function actualizarSaludo() {
            const greetingElement = document.getElementById('greetingText');
            
            // Obtener la hora actual en la zona horaria de Panamá
            const options = { timeZone: 'America/Panama', hour: 'numeric', hour12: false };
            const horaPanama = parseInt(new Intl.DateTimeFormat('en-US', options).format(new Date()));

            if (horaPanama >= 6 && horaPanama < 12) {
                greetingElement.textContent = '¡Buenos días!';
            } else if (horaPanama >= 12 && horaPanama < 19) {
                greetingElement.textContent = '¡Buenas tardes!';
            } else {
                greetingElement.textContent = '¡Buenas noches!';
            }
        }

        actualizarSaludo();

        // Interacción del formulario
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const btnSubmit = document.getElementById('btnSubmit');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.textContent = isPassword ? 'visibility' : 'visibility_off';
        });

        function validateInputs() {
            if (emailInput.value.trim() !== '' && passwordInput.value.trim() !== '') {
                btnSubmit.classList.add('active');
                btnSubmit.removeAttribute('disabled');
            } else {
                btnSubmit.classList.remove('active');
                btnSubmit.setAttribute('disabled', 'true');
            }
        }

        emailInput.addEventListener('input', validateInputs);
        passwordInput.addEventListener('input', validateInputs);
    </script>
</body>
</html>
